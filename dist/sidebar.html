<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root {
  color-scheme: light dark;
  --bg: var(--orca-background, #14171c);
  --surface: var(--orca-card, #1b2028);
  --fg: var(--orca-foreground, #e5e9f0);
  --muted: var(--orca-muted-foreground, #a0abb9);
  --line: var(--orca-border, #343b47);
  --accent: var(--orca-primary, #818cf8);
  --tint: color-mix(in srgb, var(--accent) 14%, var(--surface));
  --good: light-dark(#17714c, #67c79c);
  --warn: light-dark(#8c5912, #edb965);
  --bad: light-dark(#b33638, #f48380);
  --mono: var(--orca-font-mono, ui-monospace, monospace);
}
html.light {
  color-scheme: light;
}
html.dark {
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  color: var(--fg);
  background: var(--bg);
  font: 12px/1.4 var(--orca-font-sans, system-ui, sans-serif);
}
body > .stack {
  height: 100%;
  overflow: auto;
  gap: 0;
}
.stack,
.field,
section,
.item {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 7px;
}
.row,
.toolbar,
nav,
.choice {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.wrap {
  flex-wrap: wrap;
}
.muted,
small,
dt,
.subtitle {
  color: var(--muted);
}
.xs,
small {
  font-size: 11px;
}
h3,
p,
dl {
  margin: 0;
}
h3 {
  font-size: 13px;
}
button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
  border: 1px solid var(--line);
  border-radius: 5px;
}
input,
select,
textarea {
  min-width: 0;
  background: var(--bg);
  padding: 4px 7px;
}
select {
  text-overflow: ellipsis;
}
textarea {
  resize: vertical;
  min-height: 5em;
}
button,
summary {
  cursor: pointer;
}
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  align-self: flex-start;
  padding: 3px 8px;
  min-height: 25px;
  background: var(--surface);
  white-space: nowrap;
}
button:hover:enabled,
summary:hover {
  background: color-mix(in srgb, var(--fg) 7%, var(--surface));
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button[data-variant='ghost'],
button.link {
  background: transparent;
  border-color: transparent;
}
button[data-tone='accent'][data-variant='solid'] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--orca-primary-foreground, white);
  font-weight: 600;
}
button[data-tone='danger'],
.danger {
  color: var(--bad);
}
.warning {
  color: var(--warn);
}
.icon {
  width: 13px;
  height: 13px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon-btn {
  width: 27px;
  padding: 0;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.field {
  gap: 3px;
}
.toolbar > .field,
.row > .field {
  flex: 1;
}
.toolbar[aria-label='Connection'],
.toolbar[aria-label$=' controls'] {
  flex: none;
  padding: 7px 10px 3px;
  background: var(--surface);
}
.toolbar[aria-label='Connection'] select {
  font-weight: 600;
  width: 100%;
}
.toolbar[aria-label$=' controls'] {
  padding: 3px 10px 7px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.toolbar[aria-label$=' controls'] button {
  font-size: 11px;
  min-height: 22px;
  padding: 2px 6px;
}
.toolbar[aria-label$=' controls'] > .muted {
  margin-left: auto;
  white-space: nowrap;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
  font-weight: 600;
  white-space: nowrap;
}
.badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.badge.success {
  color: var(--good);
}
.badge.danger {
  color: var(--bad);
}
.badge.success,
.badge.danger,
.badge.warning {
  background: color-mix(in srgb, currentColor 9%, transparent);
  border-color: color-mix(in srgb, currentColor 40%, transparent);
}
body > .stack > .stack:last-child {
  flex: 1;
  min-height: 0;
  gap: 0;
}
body > .stack > .stack:last-child:not(:has(> .tabs)) {
  overflow: auto;
  padding: 10px;
  gap: 8px;
}
.tabs {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}
nav {
  flex: none;
  gap: 2px;
  padding: 0 8px;
  border-bottom: 1px solid var(--line);
}
nav button {
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  padding: 7px 9px 6px;
}
nav button[aria-current] {
  color: var(--fg);
  border-color: var(--accent);
  font-weight: 600;
}
.tab-panel {
  min-height: 0;
  overflow: auto;
  flex: 1;
  padding: 10px;
}
.tab-dag {
  display: flex;
  padding: 0;
}
.tab-dag > .stack {
  flex: 1;
  min-height: 0;
  gap: 0;
}
.tab-dag > .stack > :not(.graph-stage) {
  flex-shrink: 0;
}
.toolbar[aria-label='Asset selection'] {
  padding: 8px 10px 4px;
}
.toolbar[aria-label='Asset selection'] input {
  width: 100%;
  font-family: var(--mono);
  font-size: 11px;
}
.toolbar[aria-label='Selection filters'] {
  gap: 4px;
  padding: 2px 10px 6px;
  overflow: auto;
  scrollbar-width: thin;
}
.toolbar[aria-label='Selection filters'] button,
.choice {
  flex: none;
  min-height: 19px;
  font-size: 10.5px;
  white-space: nowrap;
}
.toolbar[aria-label='Selection filters'] button {
  display: block;
  max-width: 16ch;
  overflow: hidden;
  text-overflow: ellipsis;
  border-radius: 999px;
  padding: 1px 6px;
  color: var(--muted);
}
.toolbar[aria-label='Selection filters'] button[data-tone='accent'] {
  color: var(--fg);
  background: var(--tint);
  border-color: var(--accent);
}
.choice {
  gap: 3px;
  cursor: pointer;
}
.choice input {
  accent-color: var(--accent);
  margin: 0;
}
.toolbar[aria-label='Graph tools'] {
  position: relative;
  align-items: flex-start;
  gap: 6px;
  padding: 4px 10px;
  background: var(--surface);
  border-block: 1px solid var(--line);
}
.toolbar[aria-label='Graph tools'] > details {
  flex: 1;
  min-width: 0;
}
.toolbar[aria-label='Graph tools'] summary {
  font-size: 11px;
  color: var(--muted);
  padding: 2px 0;
}
.toolbar[aria-label='Graph tools'] .field:has(> select) {
  flex: 0 1 108px;
}
.toolbar[aria-label='Graph tools'] > .field select {
  font-size: 10.5px;
  padding: 1px 4px;
}
.toolbar[aria-label='Graph tools'] details > .stack {
  max-height: 32vh;
  overflow: auto;
  padding: 6px 0;
}
section,
.item {
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
}
.callout {
  margin: 5px 8px;
}
.tab-dag > .stack > .stack {
  max-height: 30vh;
  overflow-y: auto;
  padding: 6px 8px;
}
.toolbar[aria-label='Materialization review'] {
  justify-content: space-between;
}
.tab-dag > .stack > section {
  max-height: 30vh;
  overflow: auto;
  margin: 4px 8px;
}
.item[aria-current='true'],
.tree-row[aria-pressed='true'] {
  border-color: var(--accent);
  background: var(--tint);
}
.tree,
.scroll,
pre {
  overflow: auto;
}
[data-max-height='sm'] {
  max-height: 10rem;
}
[data-max-height='md'] {
  max-height: 19rem;
}
[data-max-height='lg'] {
  max-height: 30rem;
}
.tree details {
  margin-left: 6px;
}
summary {
  padding: 4px;
  font-weight: 500;
}
.tree-row {
  width: 100%;
  display: block;
  text-align: left;
  border-color: transparent;
  white-space: normal;
}
.tree-row .icon {
  margin-right: 5px;
  vertical-align: middle;
}
.tree-row small,
.partition-grid small,
.calendar small {
  display: block;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td,
th {
  padding: 5px;
  text-align: left;
  border-bottom: 1px solid var(--line);
}
tbody tr {
  cursor: pointer;
}
tbody tr:hover {
  background: var(--surface);
}
dd {
  margin: 0;
}
pre {
  margin: 0;
  padding: 6px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: var(--bg);
  font: 11px/1.5 var(--mono);
}
.graph-stage {
  position: relative;
  flex: 1 0 180px;
  min-height: 180px;
  overflow: hidden;
  background:
    radial-gradient(circle, color-mix(in srgb, var(--muted) 24%, transparent) 1px, transparent 1px)
      0 0 / 16px 16px,
    var(--bg);
}
.canvas {
  position: absolute;
  inset: 0;
  overflow: auto;
  touch-action: none;
  cursor: grab;
  scrollbar-width: thin;
}
.canvas:active {
  cursor: grabbing;
}
.canvas > svg {
  display: block;
  margin: 0 auto 40px;
}
.canvas-empty {
  position: absolute;
  padding: 15px;
  color: var(--muted);
}
.canvas-footer {
  position: absolute;
  bottom: 12px;
  inset-inline: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}
.canvas-hint,
.zoom {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.canvas-hint {
  font-size: 10px;
  padding: 3px 6px;
  color: var(--muted);
  white-space: nowrap;
}
.zoom {
  display: flex;
  align-items: center;
  padding: 2px;
  pointer-events: auto;
  box-shadow: 0 2px 8px #0002;
}
.zoom button {
  min-height: 23px;
  padding: 2px 6px;
  border: 0;
  font-size: 11px;
  background: transparent;
}
.zoom .zoom-level {
  min-width: 40px;
  font-family: var(--mono);
}
.edge {
  fill: none;
  stroke: color-mix(in srgb, var(--muted) 65%, transparent);
  stroke-width: 1.5;
}
.edge.active {
  stroke: var(--accent);
  stroke-width: 2;
}
.edge.dim {
  opacity: 0.35;
}
.node {
  cursor: pointer;
}
.node-card {
  fill: var(--surface);
  stroke: color-mix(in srgb, var(--muted) 55%, var(--surface));
}
.node.selected .node-card,
.node:focus .node-card {
  stroke: var(--accent);
  stroke-width: 2.5;
}
.node-name {
  fill: var(--fg);
  font: 600 12px var(--mono);
}
.node .subtitle {
  fill: var(--muted);
  font: 11px var(--orca-font-sans, system-ui);
}
.node-note {
  fill: var(--warn);
  font-size: 9px;
}
.status-dot {
  fill: var(--muted);
}
.status-dot.success {
  fill: var(--good);
}
.status-dot.danger {
  fill: var(--bad);
}
.status-dot.warning {
  fill: var(--warn);
}
.check-badge rect {
  fill: color-mix(in srgb, var(--good) 13%, var(--surface));
}
.check-badge text {
  fill: var(--good);
  font: 600 10px var(--mono);
}
.check-badge.failed text {
  fill: var(--bad);
}
.node.dim {
  opacity: 0.42;
}
.node.running .node-card {
  stroke: var(--accent);
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  50% {
    stroke-width: 3;
  }
}
@media (prefers-reduced-motion: reduce) {
  .node.running .node-card {
    animation: none;
  }
}
@media (max-width: 400px) {
  .toolbar[aria-label$=' controls'] .icon {
    display: none;
  }
  .toolbar[aria-label$=' controls'] .muted > span {
    display: none;
  }
}
@media (max-width: 280px) {
  .canvas-hint {
    display: none;
  }
  .canvas-footer {
    justify-content: flex-end;
  }
}
.calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 2px;
  text-align: center;
}
.calendar button {
  padding: 3px 0;
}
.calendar small {
  overflow: hidden;
  text-overflow: ellipsis;
}
.calendar .success,
.partition-grid .success {
  border-color: #459673;
}
.calendar .failed,
.partition-grid .failed {
  border-color: #d36d56;
}
.partition-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 4px;
}
.track {
  position: relative;
  height: 7px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--fg) 10%, transparent);
}
.bar {
  position: absolute;
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
}
.bar.success {
  background: #459673;
}
.bar.failure,
.bar.failed {
  background: #d36d56;
}

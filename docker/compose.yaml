services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data

  sample-code:
    build:
      context: ./sample_project
      dockerfile: Dockerfile
    image: orca-dagster-dev:latest
    command:
      - uv
      - run
      - --no-sync
      - dagster
      - api
      - grpc
      - -h
      - "0.0.0.0"
      - -p
      - "4000"
      - -m
      - sample_project.definitions
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      PYTHONPATH: /app/src
    volumes:
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./sample_project/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run --no-sync dagster api grpc-health-check -p 4000 -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  dagster-webserver:
    image: orca-dagster-dev:latest
    command:
      - uv
      - run
      - --no-sync
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
    volumes:
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      sample-code:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  dagster-daemon:
    image: orca-dagster-dev:latest
    command:
      - uv
      - run
      - --no-sync
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
    volumes:
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      sample-code:
        condition: service_healthy

  remote-auth-proxy:
    image: nginx:1.27-alpine
    ports:
      - "3001:3001"
    volumes:
      - ./auth-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dagster-webserver:
        condition: service_healthy

volumes:
  dagster_pg_data:

[project]
name = "sample-project"
version = "0.1.0"
description = "Sample Dagster project for developing and testing the Dagster Orca plugin"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9.0,<2.0.0",
    "dagster-webserver>=1.9.0,<2.0.0",
    "dagster-postgres>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_project"]

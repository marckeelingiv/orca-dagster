# Simulates a token-authenticated remote Dagster OSS or Dagster+ endpoint.
# Accepts either:
#   Authorization: Bearer dev-dagster-token
#   Dagster-Cloud-Api-Token: dev-dagster-token
server {
    listen 3001;
    server_name localhost;

    set $auth_ok 0;
    if ($http_authorization = "Bearer dev-dagster-token") {
        set $auth_ok 1;
    }
    if ($http_dagster_cloud_api_token = "dev-dagster-token") {
        set $auth_ok 1;
    }

    location / {
        if ($auth_ok = 0) {
            add_header Content-Type application/json always;
            return 401 '{"error":"unauthorized","message":"Provide a valid Bearer or Dagster-Cloud-Api-Token credential"}';
        }

        proxy_pass http://dagster-webserver:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
